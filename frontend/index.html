<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smart Extractor & Chat Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>window.__API_BASE__ = "https://smart-extractor-service.onrender.com";</script>
<style>
  :root {
    --bg: #070a0e;
    --panel: rgba(19, 26, 34, 0.72);
    --panel-solid: #131a22;
    --panel-raised: #1a232d;
    --border: #26323d;
    --border-soft: #1b242d;
    --text: #e7edf2;
    --muted: #6f8194;
    --muted-dim: #445263;
    --accent: #ffb454;
    --accent-2: #ff8a5c;
    --accent-soft: rgba(255, 180, 84, 0.10);
    --accent-border: rgba(255, 180, 84, 0.4);
    --teal: #5eead4;
    --teal-soft: rgba(94, 234, 212, 0.10);
    --danger: #ff6b6b;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  /* ambient glow field + grid, fixed behind everything */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(600px 400px at 15% -5%, rgba(255,180,84,0.10), transparent 60%),
      radial-gradient(500px 380px at 100% 10%, rgba(94,234,212,0.07), transparent 60%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 100% 32px;
  }
  .app { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 36px 18px 80px; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding-bottom: 22px; margin-bottom: 22px;
    border-bottom: 1px solid var(--border-soft);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 {
    font-family: var(--mono); font-size: 26px; font-weight: 700;
    letter-spacing: -0.5px; margin: 0; line-height: 1.15;
    background: linear-gradient(100deg, var(--text) 30%, var(--accent) 75%, var(--teal) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .status-block { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .status {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .status .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
    box-shadow: 0 0 10px var(--teal), 0 0 2px var(--teal);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

  /* signature element: animated signal waveform */
  .waveform { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
  .waveform span {
    width: 2.5px; background: linear-gradient(180deg, var(--accent), var(--teal));
    border-radius: 1px; opacity: 0.65;
    animation: wave 1.2s ease-in-out infinite;
  }
  @keyframes wave { 0%,100% { height: 3px; } 50% { height: 15px; } }

  /* ---- Tabs ---- */
  nav { display: flex; gap: 0; margin-bottom: 20px; position: relative; background: var(--panel-solid); border-radius: 8px; border: 1px solid var(--border-soft); padding: 3px; }
  nav button {
    flex: 1; background: transparent; border: none;
    color: var(--muted); padding: 10px 14px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; border-radius: 6px; transition: all 0.2s ease;
    position: relative;
  }
  nav button.active {
    background: linear-gradient(135deg, var(--accent-soft), var(--teal-soft));
    color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent-border);
  }
  nav button:not(.active):hover { color: var(--text); }

  .panel {
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--border-soft); border-radius: 12px; padding: 20px;
    box-shadow: 0 20px 50px -30px rgba(0,0,0,0.6);
    animation: rise 0.35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  label {
    display: block; font-family: var(--mono); font-size: 10px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  select, textarea, input[type=text] {
    background: rgba(7,10,14,0.6); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 10px 12px; font-family: var(--sans);
    font-size: 13.5px; width: 100%; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  select { font-family: var(--mono); font-size: 12px; }
  select:focus, textarea:focus, input:focus {
    border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 100px; line-height: 1.55; }
  .row { margin-bottom: 16px; }

  button.primary {
    background: linear-gradient(135deg, var(--accent-soft), rgba(255,138,92,0.12));
    color: var(--accent); border: 1px solid var(--accent-border);
    padding: 10px 20px; border-radius: 7px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; transition: all 0.18s ease;
  }
  button.primary:hover:not(:disabled) {
    box-shadow: 0 0 22px -6px var(--accent-border); transform: translateY(-1px);
  }
  button.primary:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* ---- Chat ---- */
  .chat-log {
    display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px;
    max-height: 440px; overflow-y: auto; padding-right: 4px;
  }
  .msg-row { display: flex; flex-direction: column; gap: 4px; max-width: 82%; animation: rise 0.25s ease both; }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.assistant { align-self: flex-start; }
  .msg-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px;
    color: var(--muted-dim); text-transform: uppercase; padding: 0 3px;
  }
  .msg {
    padding: 11px 14px; border-radius: 9px; white-space: pre-wrap;
    line-height: 1.6; font-size: 13.5px;
  }
  .msg-row.user .msg { background: var(--panel-raised); color: var(--text); }
  .msg-row.assistant .msg {
    background: linear-gradient(135deg, rgba(255,180,84,0.05), transparent);
    border: 1px solid var(--border-soft); color: var(--text);
  }
  .cursor { color: var(--accent); animation: blink 1s step-start infinite; text-shadow: 0 0 8px var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }

  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row textarea { min-height: 46px; }

  /* ---- Extractor scan panel ---- */
  .scan-panel {
    margin-top: 18px; border: 1px solid var(--border-soft);
    border-radius: 10px; overflow: hidden;
  }
  .scan-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: var(--panel-raised);
    border-bottom: 1px solid var(--border-soft);
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase;
  }
  .scan-header .tag {
    color: var(--teal); background: var(--teal-soft); padding: 2px 8px;
    border-radius: 4px; letter-spacing: 1px;
  }
  .scan-field {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid var(--border-soft);
    font-family: var(--mono); font-size: 12.5px;
    animation: reveal 0.4s ease both;
  }
  .scan-field:last-child { border-bottom: none; }
  @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .scan-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .scan-dot.filled { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .scan-dot.empty { background: transparent; border: 1px solid var(--muted-dim); }
  .scan-key { color: var(--muted); min-width: 130px; }
  .scan-val { color: var(--text); }
  .scan-val.null { color: var(--muted-dim); font-style: italic; }

  .meta-strip {
    display: flex; gap: 20px; padding: 11px 14px;
    background: rgba(255,255,255,0.015);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    flex-wrap: wrap;
  }
  .meta-strip b { color: var(--teal); font-weight: 600; }
  .err {
    color: var(--danger); font-size: 12px; margin-top: 12px;
    font-family: var(--mono); padding: 8px 12px;
    background: rgba(255,107,107,0.08); border-radius: 6px;
    border: 1px solid rgba(255,107,107,0.25);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
const API_BASE = window.__API_BASE__ || "http://localhost:8000";

const FIELD_ORDER = [
  "full_name", "company", "email", "phone",
  "interest_level", "urgency", "budget_mentioned",
  "product_interest", "next_step",
];

function useRoles() {
  const [roles, setRoles] = useState(["general_assistant"]);
  useEffect(() => {
    fetch(`${API_BASE}/roles`).then(r => r.json()).then(d => setRoles(d.roles)).catch(() => {});
  }, []);
  return roles;
}

function Waveform() {
  const bars = Array.from({ length: 9 });
  return (
    <div className="waveform">
      {bars.map((_, i) => (
        <span key={i} style={{ animationDelay: `${i * 0.09}s` }}></span>
      ))}
    </div>
  );
}

function ChatTab() {
  const roles = useRoles();
  const [role, setRole] = useState("general_assistant");
  const [input, setInput] = useState("");
  const [messages, setMessages] = useState([]);
  const [streaming, setStreaming] = useState(false);
  const [error, setError] = useState(null);
  const logRef = useRef(null);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [messages]);

  async function send() {
    if (!input.trim() || streaming) return;
    const userMsg = { role: "user", content: input };
    const history = [...messages, userMsg];
    setMessages([...history, { role: "assistant", content: "" }]);
    setInput("");
    setStreaming(true);
    setError(null);

    try {
      const resp = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: history.map(m => ({ role: m.role, content: m.content })),
          role, temperature: 0.7,
        }),
      });
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let acc = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        acc += decoder.decode(value, { stream: true });
        setMessages(prev => {
          const copy = [...prev];
          copy[copy.length - 1] = { role: "assistant", content: acc };
          return copy;
        });
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setStreaming(false);
    }
  }

  return (
    <div className="panel">
      <div className="row">
        <label>Persona</label>
        <select value={role} onChange={e => setRole(e.target.value)}>
          {roles.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
      </div>
      <div className="chat-log" ref={logRef}>
        {messages.map((m, i) => {
          const isLast = i === messages.length - 1;
          return (
            <div key={i} className={`msg-row ${m.role}`}>
              <span className="msg-tag">{m.role === "user" ? "you" : role}</span>
              <div className="msg">
                {m.content}
                {streaming && isLast && m.role === "assistant" && <span className="cursor">▌</span>}
              </div>
            </div>
          );
        })}
      </div>
      <div className="chat-input-row">
        <textarea
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder="Transmit a message..."
        />
        <button className="primary" onClick={send} disabled={streaming}>
          {streaming ? "···" : "Send"}
        </button>
      </div>
      {error && <div className="err">ERR // {error}</div>}
    </div>
  );
}

function ExtractTab() {
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  async function runExtract() {
    if (!text.trim()) return;
    setLoading(true);
    setError(null);
    setResult(null);
    try {
      const resp = await fetch(`${API_BASE}/extract`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const body = await resp.json();
      if (!resp.ok) throw new Error(body.detail || `Server returned ${resp.status}`);
      setResult(body);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="panel">
      <div className="row">
        <label>Raw input text</label>
        <textarea
          value={text}
          onChange={e => setText(e.target.value)}
          placeholder="Paste a lead email to scan..."
          style={{ minHeight: 150 }}
        />
      </div>
      <button className="primary" onClick={runExtract} disabled={loading}>
        {loading ? "Scanning..." : "Run extraction"}
      </button>
      {error && <div className="err">ERR // {error}</div>}

      {result && (
        <div className="scan-panel">
          <div className="scan-header">
            <span>Extracted fields</span>
            <span className="tag">prompt {result.prompt_version}</span>
          </div>
          {FIELD_ORDER.map((key, i) => {
            const val = result.data[key];
            const isNull = val === null || val === "unknown";
            return (
              <div className="scan-field" key={key} style={{ animationDelay: `${i * 50}ms` }}>
                <span className={`scan-dot ${isNull ? "empty" : "filled"}`}></span>
                <span className="scan-key">{key}</span>
                <span className={`scan-val ${isNull ? "null" : ""}`}>
                  {isNull ? (val === "unknown" ? "unknown" : "null") : String(val)}
                </span>
              </div>
            );
          })}
          <div className="meta-strip">
            <span>retries <b>{result.retries_used}</b></span>
            <span>tokens <b>{result.usage.total_tokens}</b></span>
            <span>cost <b>${result.cost_usd.toFixed(5)}</b></span>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("chat");
  return (
    <div className="app">
      <header>
        <div>
          <div className="eyebrow">LLM Ops Console</div>
          <h1>Smart Extractor &amp; Chat</h1>
        </div>
        <div className="status-block">
          <div className="status"><span className="pulse"></span>{API_BASE.replace(/^https?:\/\//, "")}</div>
          <Waveform />
        </div>
      </header>
      <nav>
        <button className={tab === "chat" ? "active" : ""} onClick={() => setTab("chat")}>Transmit</button>
        <button className={tab === "extract" ? "active" : ""} onClick={() => setTab("extract")}>Extract</button>
      </nav>
      {tab === "chat" ? <ChatTab /> : <ExtractTab />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
